<!doctype html>
<!--
  The eyeball check: manifests from a running gateway, in the viewers people actually use.

  EVERY VIEWER IS AN IFRAME ONTO THE HARNESS PAGE THE ASSERTIONS DRIVE. That is the point of this file's
  rewrite. It used to embed the viewers itself — Mirador 3.3.0 from unpkg, Clover's WEB component from
  jsdelivr — while dev/viewer-check.sh pinned Mirador 3.4.3 and bundled Clover's REACT component. So a
  person reviewing a manifest was looking at different software from the one that had asserted on it, and
  a screenshot in out/ came from a third build again. Now /mirador.html, /clover.html and /uv/uv.html are
  the same files in both modes, served from the same image.

  Universal Viewer is here at all because it is served rather than imported: it resolves its own chunks
  relative to the script tag that loaded it, so the shipped dist works whole and nothing else does.

  Served by serve.mjs inside that image — `make viewer-open`. The gateway must be running.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IIIF gateway — viewer review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; --rule: #ccc; --ink: #16181d; --paper: #fbfbfc; --accent: #1a6480; }
  @media (prefers-color-scheme: dark) {
    :root { --rule: #333; --ink: #e7e9ee; --paper: #121419; --accent: #6ab6d4; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column;
         font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  header { padding: .8rem 1rem; border-bottom: 1px solid var(--rule);
           display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; }
  h1 { font-size: 1rem; margin: 0 1rem 0 0; font-weight: 600; }
  label { font-size: .85rem; }
  select, button { font: inherit; padding: .3rem .5rem; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  #url { font: 12px/1.4 ui-monospace, monospace; opacity: .7; flex-basis: 100%; word-break: break-all; }
  #locale-note { font-size: .85rem; flex-basis: 100%; }
  #stage { flex: 1; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>

<header>
  <h1>IIIF gateway — viewer review</h1>

  <label>Predefined document
    <select id="doc">
    </select>
  </label>

  <label>Library <input id="library" required></label>
  <label>PID <input id="pid" required></label>

  <label>Gateway
    <select id="host">
      <option value="test">test</option>
      <option value="production">production</option>
    </select>
  </label>

  <label>Manifest language
    <select id="lang">
      <option value="cs">cs</option>
      <option value="en" selected>en</option>
      <option value="pl">pl (neither — tests fallback)</option>
    </select>
  </label>

  <span>
    <button id="tab-mirador" aria-pressed="true">Mirador</button>
    <button id="tab-clover" aria-pressed="false">Clover</button>
    <button id="tab-uv" aria-pressed="false">Universal Viewer</button>
    <button id="raw">Raw JSON</button>
  </span>

  <span id="url"></span>
  <span id="locale-note" role="status"></span>
</header>

<div id="stage"><iframe id="frame" title="viewer"></iframe></div>

<script>
  const $ = (id) => document.getElementById(id);
  let gateways;
  const manifest = () => `${gateways[$('host').value]}/${$('library').value}/${$('pid').value}`;

  // The same three entry points check.mjs navigates to, and the same per-viewer difference: Mirador and
  // Clover read ?manifest=, Universal Viewer reads its own hash through UV.IIIFURLAdapter.
  //
  // UV takes no language here. Ours is passed as a viewer option, and UV configures locales through its
  // config file rather than a URL parameter — so rather than guess at a parameter that may not exist,
  // the control simply does not claim to affect it.
  const VIEWERS = {
    mirador: (m, lang) => `/mirador.html?manifest=${encodeURIComponent(m)}&lang=${lang}`,
    clover: (m, lang) => `/clover.html?manifest=${encodeURIComponent(m)}&lang=${lang}`,
    uv: (m) => `/uv/uv.html#?manifest=${encodeURIComponent(m)}`,
  };

  let current = 'mirador';

  const localeNotes = {
    mirador: 'Mirador uses this for manifest metadata. Its bundled interface stays English; some link labels use the first manifest language.',
    clover: 'Clover receives the selected manifest language. It shows that language only for fields whose IIIF language map contains it.',
    uv: 'Universal Viewer 4.0.25 has no Czech locale in this bundle, so this selection does not apply to it.',
  };

  function show(name) {
    current = name;
    for (const other of Object.keys(VIEWERS)) {
      $(`tab-${other}`).setAttribute('aria-pressed', String(other === name));
    }
    refresh();
  }

  function refresh() {
    const url = manifest();
    $('url').textContent = url;
    $('locale-note').textContent = localeNotes[current];
    $('lang').disabled = current === 'uv';
    // Reassigning src rather than reloading: a viewer holds state per instance, and the point of
    // switching documents is to see the new one built from scratch.
    $('frame').src = VIEWERS[current](url, $('lang').value);
  }

  for (const name of Object.keys(VIEWERS)) {
    $(`tab-${name}`).onclick = () => show(name);
  }
  $('raw').onclick = () => window.open(manifest(), '_blank');
  $('doc').onchange = refresh;
  $('library').onchange = refresh;
  $('pid').onchange = refresh;
  $('lang').onchange = refresh;
  $('host').onchange = refresh;

  fetch('/review-config.json')
    .then(response => response.json())
    .then(config => {
      gateways = { test: config.testUrl, production: config.productionUrl };
      for (const document of config.documents) {
        const option = new Option(document.label, `${document.library}/${document.pid}`);
        $('doc').add(option);
      }
      const selectDocument = () => {
        const [library, pid] = $('doc').value.split('/', 2);
        $('library').value = library;
        $('pid').value = pid;
        refresh();
      };
      $('doc').onchange = selectDocument;
      selectDocument();
    })
    .catch(error => {
      $('locale-note').textContent = `Could not load viewer configuration: ${error.message}`;
    });
</script>
</body>
</html>
